# XcodeGen spec: generates a real macOS *application* target (bundle, icon, signing UI) that reuses MergeCore.
#   brew install xcodegen && xcodegen && open Filipendula.xcodeproj
name: Filipendula
options:
  bundleIdPrefix: dev.filipendula
  deploymentTarget:
    macOS: "13.0"
packages:
  FilipendulaPackage:
    path: .
targets:
  Filipendula:
    type: application
    platform: macOS
    sources:
      - path: Sources/FilipendulaApp
      - path: Resources/Assets.xcassets
    dependencies:
      - package: FilipendulaPackage
        product: MergeCore
    info:
      path: Resources/Info.plist
      properties:
        CFBundleName: Filipendula
        CFBundleDisplayName: Filipendula
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "13.0"
        LSApplicationCategoryType: public.app-category.developer-tools
        NSPrincipalClass: NSApplication
    settings:
      base:
        PRODUCT_NAME: Filipendula
        PRODUCT_BUNDLE_IDENTIFIER: dev.filipendula.app
        MARKETING_VERSION: 0.1.5
        CURRENT_PROJECT_VERSION: 1
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
